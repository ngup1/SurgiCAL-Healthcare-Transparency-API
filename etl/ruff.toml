# Lint config for the ETL: the same rules as the API (api/ruff.toml).
line-length = 120
target-version = "py311"

[lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[lint.per-file-ignores]
# conftest sets DATABASE_URL before importing the pipeline.
"tests/conftest.py" = ["E402"]
# Test data is one case per line on purpose.
"tests/*.py" = ["E501"]
