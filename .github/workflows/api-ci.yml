# CI/CD for the SurgiCAL API (DEPLOYMENT_PLAN.md, Phase 9).
#
#   lint ─┐
#         ├─► publish   (main only: push the image to ghcr.io, then deploy to Render)
#   test ─┘
#   test = seeded PostGIS via docker compose → pytest → build + smoke-test the API image
name: API CI

on:
  push:
    paths:
      - "api/**"
      - "migrations/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".dockerignore"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

# A newer push to the same branch cancels the run still in progress, except on
# main, where every merge should finish publishing its image.
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.13.0
      - name: ruff check
        working-directory: api
        run: ruff check --output-format=github .
      - name: ruff format --check
        working-directory: api
        run: ruff format --check .

  test:
    name: Test + build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same database as local development: api/db/Dockerfile applies the
      # migrations and seed data; --wait blocks until the healthcheck passes,
      # which happens only after seeding finishes.
      - name: Start seeded database
        run: docker compose up --build --wait db

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt

      # conftest.py defaults to the compose database on localhost:5433.
      - name: Run tests
        working-directory: api
        run: pytest -v

      # Builds the production image and runs it against the same database:
      # catches a broken Dockerfile, missing files, or a crash on startup.
      - name: Build and start API container
        run: docker compose up --build --wait api

      - name: Smoke-test the running container
        run: |
          set -euo pipefail
          curl -fsS localhost:8000/health
          count=$(curl -fsS localhost:8000/hospitals | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "hospitals: $count"
          test "$count" -eq 27
          curl -fsS 'localhost:8000/search?q=knee' | python3 -c 'import json,sys; assert "27447" in [p["code"] for p in json.load(sys.stdin)["procedures"]]'
          echo "smoke test passed"

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Image size
        if: success()
        run: docker compose images

  publish:
    name: Publish image to ghcr.io
    needs: [lint, test]
    # Only merges (pushes) to main publish; pull requests and branches just test.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets GITHUB_TOKEN push to this repo's container registry
    env:
      # Repo secret (Settings → Secrets and variables → Actions). If unset, the
      # deploy step is skipped and the image is only published.
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v7

      # QEMU + Buildx build for two CPU types: amd64 for cloud hosts like Render,
      # arm64 so `docker run` works natively on Apple Silicon.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<short commit> (immutable, for deploys and rollbacks) and latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/surgical-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=SurgiCAL API
            org.opencontainers.image.description=Surgical pricing, quality, and device API (mock data)

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse unchanged layers from earlier runs (stored in the Actions cache).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tell Render to deploy this exact build (the immutable sha tag, not :latest),
      # so the running service always maps to a commit.
      - name: Deploy to Render
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/surgical-api:sha-${GITHUB_SHA::7}"
          encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$image")
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}&imgURL=${encoded}" > /dev/null
          echo "Deploy triggered for $image"

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Run it: \`docker run -p 8000:8000 ghcr.io/${{ github.repository_owner }}/surgical-api:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
