# CI for the ETL: lint, then the tests.
# The extractor tests run on saved API responses (etl/tests/fixtures), so they need
# no network; the database tests use the same compose database as the API tests.
name: ETL CI

on:
  push:
    paths:
      - "etl/**"
      - "migrations/**"
      - "docker-compose.yml"
      - ".github/workflows/etl-ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: etl-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements*.txt
      - name: Install dependencies
        run: pip install -r etl/requirements-dev.txt

      - name: ruff check
        working-directory: etl
        run: ruff check --output-format=github .

      # --wait blocks until migrations and seed data have loaded (see docker-compose.yml).
      - name: Start database
        run: docker compose up --build --wait db

      # conftest.py defaults to the compose database on localhost:5433.
      - name: Run tests
        working-directory: etl
        run: pytest -v

      # The migrations must also apply to an empty database the way a refresh applies them.
      - name: Apply migrations with etl.migrate
        env:
          DATABASE_URL: postgresql://surgical:surgical@localhost:5433/etl_ci?sslmode=disable
        run: |
          docker compose exec -T db psql -U surgical -d surgical -c "CREATE DATABASE etl_ci"
          python -m etl.migrate
          python -m etl.run_pipeline --list

      - name: Show database logs
        if: failure()
        run: docker compose logs db
